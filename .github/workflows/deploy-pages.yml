name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm, not npm: pnpm-lock.yaml is the lockfile that actually matches
      # package.json (vite 6, vitest 4.1.11) and is what local development uses.
      # A stale package-lock.json was tracked alongside it, so `npm ci` could not
      # install at all. See local/independent-audit-2026-09-29.md, "Release
      # readiness". The pinned version must match `packageManager` in
      # webapp/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: webapp
        run: pnpm test

      - name: Build
        working-directory: webapp
        run: pnpm run build

      # The FeatureScript has no compiler of its own, so this is the only thing
      # that catches a release build that would not paste into Feature Studio.
      - name: Check the FeatureScript release build
        run: |
          pnpm run fs:test
          pnpm run fs:check

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
